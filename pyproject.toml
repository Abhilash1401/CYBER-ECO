[tool.black]
line-length = 88
target-version = ['py312']
extend-exclude = '''
/(
  migrations
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "**/migrations/*",
    ".venv",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S"]
ignore = ["S101", "E501", "F403", "F405", "B904"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S105", "S106", "F841", "E402"]
"**/commands/seed_dev_users.py" = ["S105"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]
