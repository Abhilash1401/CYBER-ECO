name: Bug Report
description: Create a bug report to help us improve Cyber Eco
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        *If you are reporting a security vulnerability, please refer to [SECURITY.md](../SECURITY.md) instead.*
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Steps or commands to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating System, Python version, Docker version, etc.
      placeholder: "e.g., Ubuntu 22.04 / Python 3.13 / Docker 25.0"
